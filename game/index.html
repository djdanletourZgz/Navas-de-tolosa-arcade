<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Navas de Tolosa Arcade</title><style>*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#17130f;color:#f7e7b3;font-family:monospace;display:flex;justify-content:center;min-height:100vh;overflow:hidden}#w{width:min(100vw,980px);padding:6px}#hud{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap;background:#211a14;border:3px solid #6f552c;padding:7px;font-weight:900}.b{background:#382c20;border:2px solid #7d6232;padding:4px 7px}#box{position:relative;width:min(96vw,860px);aspect-ratio:15/11;margin:6px auto;border:4px solid #72572f;background:#111}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(34px,8vw,82px);font-weight:1000;text-align:center;text-shadow:5px 5px #000;opacity:0;transform:scale(.65);transition:.18s}#msg.on{opacity:1;transform:scale(1)}#start{position:absolute;inset:0;background:#0b0907e8;display:flex;align-items:center;justify-content:center;z-index:5}.card{margin:18px;padding:20px;max-width:560px;text-align:center;background:#241b14;border:4px solid #826431;box-shadow:8px 8px #090706}.card h1{font-size:clamp(28px,6vw,55px);margin:0;color:#efc34f;text-shadow:4px 4px #6e231d}.card button,.ctrl,#fire{font:inherit;font-weight:900;color:#fff1bf;border:3px solid #705426;background:#2b2118;border-radius:10px;box-shadow:0 4px #0b0907}.card button{font-size:20px;padding:12px 20px;background:#7d2b22;border-color:#d2a643}#mob{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(96vw,860px);margin:auto;align-items:center}#pad{display:grid;grid-template-columns:68px 68px 68px;grid-template-rows:56px 56px;gap:4px}.ctrl{font-size:28px}.ctrl:active,#fire:active{transform:translateY(3px);box-shadow:0 1px #0b0907}#up{grid-column:2}#left{grid-row:2}#down{grid-row:2;grid-column:2}#right{grid-row:2;grid-column:3}#fire{justify-self:end;width:min(44vw,240px);height:118px;font-size:22px;background:linear-gradient(#8d2f24,#652017);border-color:#d8a540}#hint{text-align:center;color:#c3a66a;font-size:12px;margin-top:3px}@media(max-height:780px){#pad{grid-template-columns:54px 54px 54px;grid-template-rows:44px 44px}#fire{height:86px;font-size:17px}#hint{display:none}}</style></head><body><div id="w"><div id="hud"><span class="b" id="lv">NIVEL 1/5</span><span class="b" id="wp">✝ CRUCIFIJO · 1</span><span class="b" id="bh">JEFE ♥♥♥</span><span class="b" id="sc">00000</span></div><div id="box"><canvas id="c" width="1200" height="880"></canvas><div id="msg"></div><div id="start"><div class="card"><h1>NAVAS DE TOLOSA</h1><h2>ARCADE</h2><p>5 fases. Encuentra el torrezno y revienta al jefe de cada nivel con 3 pepinazos.</p><p><b>PC:</b> flechas/WASD + espacio. <b>Móvil:</b> cruceta + PEPINAZO.</p><button id="play">¡A LA BATALLA!</button></div></div></div><div id="mob"><div id="pad"><button class="ctrl" id="up">▲</button><button class="ctrl" id="left">◀</button><button class="ctrl" id="down">▼</button><button class="ctrl" id="right">▶</button></div><button id="fire">💥<br>PEPINAZO</button></div><div id="hint">Crucifijo: 1 casilla · Torrezno: 2 casillas · Explosión tras 1,5 s · R reinicia</div></div><script>const cv=document.getElementById('c'),x=cv.getContext('2d');x.imageSmoothingEnabled=false;const C=15,R=11,TW=cv.width/C,TH=cv.height/R,cfg=[{cr:22,en:2,es:900,bs:1150},{cr:27,en:3,es:800,bs:1080},{cr:31,en:4,es:720,bs:980},{cr:35,en:5,es:640,bs:920},{cr:39,en:6,es:560,bs:860}];let L=1,score=0,over=false,trans=false,tor=false,g=[],p={},es=[],boss={},bombs=[],pick=null,last=performance.now(),keys={};const $=q=>document.getElementById(q),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,tcx=a=>(a+.5)*TW,tcy=a=>(a+.5)*TH;function say(t,col='#ffe46b',ms=1200){let m=$('msg');m.textContent=t;m.style.color=col;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),ms)}function ent(a,b){return{x:a,y:b,px:tcx(a),py:tcy(b),dir:'down',step:0,next:0,inv:0,cool:0,alive:true}}function hud(){$('lv').textContent=`NIVEL ${L}/5`;$('wp').textContent=tor?'🥓 TORREZNO · 2':'✝ CRUCIFIJO · 1';$('bh').textContent=boss.alive?'JEFE '+('♥'.repeat(boss.hp)):'JEFE ☠';$('sc').textContent=String(score).padStart(5,'0')}function level(){trans=over=tor=false;bombs=[];pick=null;es=[];g=Array.from({length:R},()=>Array(C).fill(0));for(let j=0;j<R;j++)for(let i=0;i<C;i++)if(i===0||j===0||i===C-1||j===R-1||(i%2===0&&j%2===0))g[j][i]=1;p=ent(1,1);boss=ent(C-2,R-2);boss.hp=3;let safe=new Set(['1,1','1,2','2,1',`${C-2},${R-2}`,`${C-3},${R-2}`,`${C-2},${R-3}`]),n=0,k=cfg[L-1];while(n<k.cr){let i=rnd(1,C-2),j=rnd(1,R-2);if(!g[j][i]&&!safe.has(`${i},${j}`)){g[j][i]=2;n++}}let q=[];for(let j=1;j<R-1;j++)for(let i=1;i<C-1;i++)if(g[j][i]===2)q.push({x:i,y:j});if(q.length){let z=q[rnd(0,q.length-1)];pick={x:z.x,y:z.y,hidden:true,taken:false,t:0}}for(let n=0;n<k.en;n++){let i,j;do{i=rnd(3,C-3);j=rnd(1,R-2)}while(g[j][i]||Math.abs(i-p.x)+Math.abs(j-p.y)<5);let e=ent(i,j);e.next=performance.now()+rnd(200,800);es.push(e)}boss.next=performance.now()+600;hud();say('NIVEL '+L,'#f4d15e',800)}function blocking(i,j){return bombs.some(b=>!b.ex&&b.x===i&&b.y===j)}function pass(i,j){return i>=0&&j>=0&&i<C&&j<R&&g[j][i]===0&&!blocking(i,j)}function move(e,dx,dy){let nx=e.x+dx,ny=e.y+dy;if(dx>0)e.dir='right';if(dx<0)e.dir='left';if(dy>0)e.dir='down';if(dy<0)e.dir='up';if(pass(nx,ny)&&!(boss.alive&&e!==boss&&boss.x===nx&&boss.y===ny)){e.x=nx;e.y=ny;e.step++;return true}return false}function fire(){if(over||trans||p.cool>0||blocking(p.x,p.y))return;p.cool=420;bombs.push({x:p.x,y:p.y,kind:tor?'t':'c',range:tor?2:1,at:performance.now(),boom:performance.now()+1500,ex:false,cells:[],until:0})}function blast(b){let ds=[[0,0],[1,0],[-1,0],[0,1],[0,-1]],cells=[];for(let[d1,d2]of ds){let max=d1||d2?b.range:0;for(let n=0;n<=max;n++){let i=b.x+d1*n,j=b.y+d2*n;if(i<0||j<0||i>=C||j>=R||g[j][i]===1)break;cells.push({x:i,y:j});if(g[j][i]===2){g[j][i]=0;score+=50;if(pick&&pick.hidden&&pick.x===i&&pick.y===j)pick.hidden=false;break}}}b.ex=true;b.cells=cells;b.until=performance.now()+430;for(let c of cells){for(let e of es)if(e.alive&&e.x===c.x&&e.y===c.y){e.alive=false;score+=200}if(boss.alive&&boss.x===c.x&&boss.y===c.y){boss.hp--;score+=350;if(boss.hp<=0){boss.alive=false;score+=1000;say('¡JEFE REVENTADO!','#ff8c42',700);setTimeout(win,700)}else say(`¡PEPINAZO! ${boss.hp} ♥`,'#ff8c42',700)}if(p.x===c.x&&p.y===c.y)hurt()}hud()}function hurt(){if(p.inv>0||over)return;p.inv=1200;score=Math.max(0,score-250);hud();say('¡AY, MAÑO!','#ff6d57',650)}function win(){if(trans)return;trans=true;score+=1000*L;hud();say('ESPAÑOLAZO','#ffe34d',1700);setTimeout(()=>{if(L===5){over=true;say('¡VICTORIA ESPAÑOLAZA!','#ffe34d',5000)}else{L++;level()}},1800)}function touch(){if(pick&&!pick.hidden&&!pick.taken&&p.x===pick.x&&p.y===pick.y){pick.taken=true;tor=true;score+=500;hud();say('TORREZNAZOS','#ffbc36',1500)}for(let e of es)if(e.alive&&e.x===p.x&&e.y===p.y)hurt();if(boss.alive&&boss.x===p.x&&boss.y===p.y)hurt()}function upd(dt,now){p.cool=Math.max(0,p.cool-dt);p.inv=Math.max(0,p.inv-dt);if(pick&&!pick.hidden&&!pick.taken)pick.t+=dt*.004;for(let e of[p,boss,...es]){if(!e)continue;e.px+=(tcx(e.x)-e.px)*.22;e.py+=(tcy(e.y)-e.py)*.22}if(!over&&!trans&&now-p.next>120){let m=false;if(keys.ArrowLeft||keys.a||keys.A)m=move(p,-1,0);else if(keys.ArrowRight||keys.d||keys.D)m=move(p,1,0);else if(keys.ArrowUp||keys.w||keys.W)m=move(p,0,-1);else if(keys.ArrowDown||keys.s||keys.S)m=move(p,0,1);if(m){p.next=now;touch()}}for(let b of bombs)if(!b.ex&&now>=b.boom)blast(b);bombs=bombs.filter(b=>!b.ex||now<b.until);let k=cfg[L-1];for(let e of es){if(!e.alive)continue;if(now>=e.next&&!over&&!trans){let d=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);if(Math.random()<.5)d.sort((a,b)=>Math.abs(e.x+a[0]-p.x)+Math.abs(e.y+a[1]-p.y)-Math.abs(e.x+b[0]-p.x)-Math.abs(e.y+b[1]-p.y));for(let z of d)if(move(e,z[0],z[1]))break;e.next=now+k.es}if(e.x===p.x&&e.y===p.y)hurt()}if(boss.alive&&now>=boss.next&&!over&&!trans){let d=[[1,0],[-1,0],[0,1],[0,-1]].sort((a,b)=>Math.abs(boss.x+a[0]-p.x)+Math.abs(boss.y+a[1]-p.y)-Math.abs(boss.x+b[0]-p.x)-Math.abs(boss.y+b[1]-p.y));if(Math.random()<.25)d.reverse();for(let z of d)if(move(boss,z[0],z[1]))break;boss.next=now+k.bs}touch()}function wall(i,j){let a=i*TW,b=j*TH;x.fillStyle='#88714b';x.fillRect(a,b,TW,TH);x.fillStyle='#58452c';x.fillRect(a+6,b+6,TW-12,TH-12);x.fillStyle='#9e885f';for(let n=0;n<4;n++)x.fillRect(a+10+n*19,b+9,14,14)}function crate(i,j){let a=i*TW,b=j*TH;x.fillStyle='#8f572d';x.fillRect(a+6,b+6,TW-12,TH-12);x.fillStyle='#c88443';x.fillRect(a+12,b+12,TW-24,TH-24);x.strokeStyle='#6f3f1f';x.lineWidth=6;x.strokeRect(a+17,b+17,TW-34,TH-34)}function cross(cx,cy,s=1,blink=false){x.save();x.translate(cx,cy);if(blink)x.globalAlpha=.7+Math.sin(performance.now()/35)*.3;x.fillStyle='#6b4625';x.fillRect(-10*s,-32*s,20*s,64*s);x.fillRect(-28*s,-10*s,56*s,20*s);x.fillStyle='#e1bd79';x.fillRect(-6*s,-28*s,12*s,56*s);x.fillRect(-24*s,-6*s,48*s,12*s);x.restore()}function torz(cx,cy,s=1,bob=0,glow=false,blink=false){x.save();x.translate(cx,cy+bob);if(glow){x.fillStyle='#ffdd5930';x.beginPath();x.arc(0,0,35,0,7);x.fill()}if(blink)x.globalAlpha=.75+Math.sin(performance.now()/35)*.25;x.fillStyle='#5d2f17';x.fillRect(-30*s,-16*s,60*s,32*s);x.fillStyle='#e8b072';x.fillRect(-25*s,-11*s,50*s,22*s);x.fillStyle='#b45b2b';x.fillRect(-25*s,-11*s,50*s,6*s);x.fillStyle='#fff1c9';x.fillRect(-25*s,-2*s,50*s,6*s);x.fillStyle='#b45b2b';x.fillRect(-25*s,7*s,50*s,6*s);x.restore()}function knight(e,type){if(!e.alive||(e.inv>0&&Math.floor(performance.now()/80)%2===0))return;let bob=Math.sin(performance.now()/120+e.step)*2,swing=Math.sin(performance.now()/140+e.step)*5;x.save();x.translate(e.px,e.py+bob);x.fillStyle='#0005';x.fillRect(-25,25,50,9);x.fillStyle='#3b2414';x.fillRect(-16,18,10,25);x.fillRect(6,18,10,25);x.fillStyle='#6e4c2d';x.fillRect(-18+swing*.2,40,14,7);x.fillRect(4-swing*.2,40,14,7);let body=type==='p'?'#d7b34a':type==='b'?'#7f2630':'#4e7c3b',acc=type==='p'?'#a41d1d':type==='b'?'#c79b39':'#4c6134';x.fillStyle=body;x.fillRect(-27,-4,54,35);x.fillStyle=type==='e'?'#d8c6a4':'#f0deb0';x.fillRect(-18,-27,36,29);x.fillStyle=acc;x.fillRect(-21,-29,42,8);if(type==='b'){x.fillStyle='#e0b841';x.fillRect(-25,-37,50,8);x.fillRect(-20,-43,10,8);x.fillRect(10,-43,10,8)}x.fillStyle='#16110c';if(e.dir==='left')x.fillRect(-12,-15,5,5);else if(e.dir==='right')x.fillRect(7,-15,5,5);else{x.fillRect(-9,-15,5,5);x.fillRect(4,-15,5,5)}x.fillStyle=body;x.fillRect(-35,-2+swing*.25,10,25);x.fillRect(25,-2-swing*.25,10,25);x.fillStyle='#f0deb0';x.fillRect(-35,13+swing*.25,10,10);x.fillRect(25,13-swing*.25,10,10);if(type==='p'){x.fillStyle='#f3e7bb';x.fillRect(-46,-7,17,4);x.fillRect(-38,-15,4,21)}else if(type==='b'){x.fillStyle='#f0c94f';x.fillRect(35,-7,8,31);x.fillRect(31,-11,16,6)}else{x.fillStyle='#6a2319';x.fillRect(35,-5,8,29)}x.restore()}function draw(now){x.clearRect(0,0,cv.width,cv.height);for(let j=0;j<R;j++)for(let i=0;i<C;i++){x.fillStyle=(i+j)%2?'#4c3b27':'#56412c';x.fillRect(i*TW,j*TH,TW,TH);if(g[j][i]===1)wall(i,j);else if(g[j][i]===2)crate(i,j)}if(pick&&!pick.hidden&&!pick.taken)torz(tcx(pick.x),tcy(pick.y),1,Math.sin(pick.t)*3,true);for(let b of bombs){if(!b.ex){let pulse=1+Math.sin((now-b.at)/120)*.06;if(b.kind==='c')cross(tcx(b.x),tcy(b.y),pulse,b.boom-now<450);else torz(tcx(b.x),tcy(b.y),pulse,0,false,b.boom-now<450)}else for(let c of b.cells){let a=c.x*TW,d=c.y*TH;x.fillStyle='#ffdd59';x.fillRect(a+4,d+4,TW-8,TH-8);x.fillStyle='#ff9f1a';x.fillRect(a+TW*.18,d+TH*.18,TW*.64,TH*.64);x.fillStyle='#fff3a1';x.fillRect(a+TW*.35,d+TH*.35,TW*.3,TH*.3)}}for(let e of es)knight(e,'e');if(boss.alive)knight(boss,'b');knight(p,'p')}function loop(now){let dt=now-last;last=now;upd(dt,now);draw(now);requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fire()}if(e.key==='r'||e.key==='R'){L=1;score=0;level()}});addEventListener('keyup',e=>keys[e.key]=false);function bind(id,k){let e=$(id);['touchstart','mousedown'].forEach(v=>e.addEventListener(v,a=>{a.preventDefault();keys[k]=true}));['touchend','mouseup','mouseleave','touchcancel'].forEach(v=>e.addEventListener(v,a=>{a.preventDefault();keys[k]=false}))}bind('left','ArrowLeft');bind('right','ArrowRight');bind('up','ArrowUp');bind('down','ArrowDown');$('fire').onclick=e=>{e.preventDefault();fire()};$('play').onclick=()=>{$('start').style.display='none';L=1;score=0;level();requestAnimationFrame(loop)};</script></body></html>
