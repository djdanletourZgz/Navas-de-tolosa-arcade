*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#15110d;color:#f7e7b3;font-family:monospace;min-height:100%;overflow:hidden}body{display:flex;justify-content:center}#w{width:min(100vw,900px);padding:3px}#hud{display:flex;gap:3px;justify-content:space-between;flex-wrap:wrap;background:#211a14;border:2px solid #6f552c;padding:4px;font-weight:900;font-size:12px}.b{background:#382c20;border:1px solid #7d6232;padding:3px 5px}#box{position:relative;width:min(86vw,750px);aspect-ratio:15/11;margin:4px auto;border:3px solid #72572f;background:#111;overflow:hidden;box-shadow:0 0 0 3px #0b0907}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(27px,7vw,70px);font-weight:1000;text-align:center;text-shadow:5px 5px #000;opacity:0;transform:scale(.72);transition:.18s;z-index:4;padding:18px}#msg.on{opacity:1;transform:scale(1)}#start{position:absolute;inset:0;background:#0b0907ef;display:flex;align-items:center;justify-content:center;z-index:5}.card{margin:14px;padding:16px;max-width:560px;text-align:center;background:#241b14;border:3px solid #826431;box-shadow:6px 6px #090706}.card h1{font-size:clamp(25px,5.5vw,50px);margin:0;color:#efc34f;text-shadow:4px 4px #6e231d}.card button,.ctrl,#fire{font:inherit;font-weight:900;color:#fff1bf;border:2px solid #705426;background:#2b2118;border-radius:9px;box-shadow:0 3px #0b0907}.card button{font-size:18px;padding:10px 18px;background:#7d2b22;border-color:#d2a643}#mob{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(94vw,790px);margin:0 auto;align-items:end}#pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:46px 46px;gap:3px}.ctrl{font-size:23px}.ctrl:active,#fire:active{transform:translateY(2px);box-shadow:0 1px #0b0907}#up{grid-column:2}#left{grid-row:2}#down{grid-row:2;grid-column:2}#right{grid </style></head><body><div id="w"><div id="hud"><span class="b" id="lv">NIVEL 1/5</span><span class="b" id="place">SAGRAJAS</span><span class="b" id="life">VIDAS ♥♥♥</span><span class="b" id="wp">✝ · 1</span><span class="b" id="bh">MEHMET ♥♥♥</span><span class="b" id="sc">00000</span></div><div id="box"><canvas id="c" width="1536" height="1126"></canvas><div id="msg"></div><div id="start"><div class="card"><h1>NAVAS DE TOLOSA</h1><h2>ARCADE · V4</h2><p>5 batallas, 3 niveles de arma y jefes con patrones propios.</p><p><b>PC:</b> flechas/WASD + espacio. <b>Móvil:</b> cruceta + PEPINAZO.</p><button id="play">¡A LA BATALLA!</button></div></div></div><div id="mob"><div id="pad"><button class="ctrl" id="up">▲</button><button class="ctrl" id="left">◀</button><button class="ctrl" id="down">▼</button><button class="ctrl" id="right">▶</button></div><button id="fire">💥<br>PEPINAZO</button></div><div id="hint">Crucifijo → Torrezno → Torrezno de Soria · Dos fuegos unidos = Explosión Sagrada</div></div><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const C=15,R=11,TW=cv.width/C,TH=cv.height/R;
const PLACES=['SAGRAJAS','UCLÉS','ALARCOS','NAVAS DE TOLOSA','RÍO SALADO'];
const BOSSES=[{name:'MEHMET',hp:3,speed:960,iq:.55},{name:'AMIR',hp:3,speed:800,iq:.64,sprint:true},{name:'MOHAMED',hp:4,speed:790,iq:.86},{name:'HASSAN',hp:5,speed:710,iq:.84,sappers:true},{name:'AHMED',hp:5,speed:670,iq:.91,sappers:true,tele:true,elite:true}];
const CFG=[{cr:19,en:2,es:870,hard:3},{cr:23,en:3,es:750,hard:4},{cr:26,en:4,es:690,hard:4},{cr:30,en:5,es:630,hard:5},{cr:33,en:6,es:580,hard:6}];
let L=1,score=0,lives=3,over=false,trans=false,weapon=0,g=[],water=new Set(),blood=new Set(),p={},enemies=[],boss={},bombs=[],picks=[],sappers=[],last=performance.now(),keys={},duel=false,zoom=1,zoomTarget=1,elite=null;
const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,tcx=a=>(a+.5)*TW,tcy=a=>(a+.5)*TH,key=(a,b)=>a+','+b;
function say(t,col='#ffe46b',ms=1100){const m=$('msg');m.textContent=t;m.style.color=col;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),ms)}
function ent(a,b){return{x:a,y:b,px:tcx(a),py:tcy(b),dir:'down',lastDir:'down',step:0,next:0,inv:0,cool:0,alive:true}}
function normalsAlive(){return enemies.filter(e=>e.alive).length+(elite&&elite.alive?1:0)}
function hud(){const bd=BOSSES[L-1];$('lv').textContent=`NIVEL ${L}/5`;$('place').textContent=PLACES[L-1];$('life').textContent='VIDAS '+('♥'.repeat(lives));$('wp').textContent=weapon===0?'✝ · 1':weapon===1?'🥓 · 2':'🥓🥓 SORIA';$('bh').textContent=bd.name+' '+(boss.alive?'♥'.repeat(boss.hp):'☠');$('sc').textContent=String(score).padStart(5,'0')}
function makeWater(){water.clear();if(L<3)return;const patterns=L===3?[[3,7],7]:L===4?[[2,6,8],5]:[[3,5,7],9];for(const y of patterns[0])for(let x=1;x<C-1;x++){if(g[y][x]===1||g[y][x]===3)continue;water.add(key(x,y));if(g[y][x]===2&&Math.random()<.65)g[y][x]=0}const col=patterns[1];for(let y=1;y<R-1;y++){if(g[y][col]===1||g[y][col]===3)continue;water.add(key(col,y));if(g[y][col]===2&&Math.random()<.65)g[y][col]=0}}
function freeTile(minD=0,maxD=99,origin=p){for(let tries=0;tries<120;tries++){const x=rnd(1,C-2),y=rnd(1,R-2),d=Math.abs(x-origin.x)+Math.abs(y-origin.y);if(pass(x,y)&&d>=minD&&d<=maxD&&!enemies.some(e=>e.alive&&e.x===x&&e.y===y)&&!(elite&&elite.alive&&elite.x===x&&elite.y===y))return{x,y}}return null}
function level(){trans=over=false;weapon=0;bombs=[];picks=[];sappers=[];enemies=[];elite=null;duel=false;zoom=zoomTarget=1;lives=L===5?5:3;g=Array.from({length:R},()=>Array(C).fill(0));for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(x===0||y===0||x===C-1||y===R-1||(x%2===0&&y%2===0))g[y][x]=1;p=ent(1,1);boss=ent(C-2,R-2);const bd=BOSSES[L-1];boss.hp=bd.hp;boss.next=performance.now()+650;boss.nextSpecial=performance.now()+rnd(5000,10000);boss.nextTele=performance.now()+7000;boss.nextElite=performance.now()+15000;boss.sprintAt=performance.now()+rnd(4000,6000);boss.sprintUntil=0;boss.restUntil=0;const safe=new Set(['1,1','1,2','2,1',key(C-2,R-2),key(C-3,R-2),key(C-2,R-3)]),k=CFG[L-1];let n=0;while(n<k.cr){let x=rnd(1,C-2),y=rnd(1,R-2);if(!g[y][x]&&!safe.has(key(x,y))){g[y][x]=2;n++}}let h=0;while(h<k.hard){let x=rnd(1,C-2),y=rnd(1,R-2);if(g[y][x]===0&&!safe.has(key(x,y))){g[y][x]=3;h++}}makeWater();let crates=[];for(let y=1;y<R-1;y++)for(let x=1;x<C-1;x++)if(g[y][x]===2)crates.push({x,y});crates.sort(()=>Math.random()-.5);if(crates[0])picks.push({x:crates[0].x,y:crates[0].y,type:1,hidden:true,taken:false,t:0});if(crates[1])picks.push({x:crates[1].x,y:crates[1].y,type:2,hidden:true,taken:false,t:0});for(let i=0;i<k.en;i++){let pos=freeTile(5,99,p);if(pos){let e=ent(pos.x,pos.y);e.next=performance.now()+rnd(200,800);enemies.push(e)}}hud();say(PLACES[L-1]+' · '+bd.name,'#f4d15e',1150)}
function blocking(x,y){return bombs.some(b=>!b.ex&&b.x===x&&b.y===y)}function pass(x,y){return x>=0&&y>=0&&x<C&&y<R&&g[y][x]===0&&!blocking(x,y)}function waterAt(e){return water.has(key(e.x,e.y))}function bloodAt(e){return blood.has(key(e.x,e.y))}
function move(e,dx,dy){let desired=dx>0?'right':dx<0?'left':dy>0?'down':'up';if(e===p&&bloodAt(e)&&desired!==e.lastDir&&Math.random()<.62){const dirs={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]},sl=dirs[e.lastDir],sx=e.x+sl[0],sy=e.y+sl[1];if(pass(sx,sy)){e.x=sx;e.y=sy;e.dir=e.lastDir;e.step++;say('¡PATINA!','#ff9b8f',260);return true}}const nx=e.x+dx,ny=e.y+dy;e.dir=desired;if(pass(nx,ny)&&!(boss.alive&&e!==boss&&boss.x===nx&&boss.y===ny)){e.x=nx;e.y=ny;e.lastDir=desired;e.step++;return true}return false}
function fire(){if(over||trans||p.cool>0)return;const limit=weapon===2?2:1;if(bombs.filter(b=>!b.ex).length>=limit||blocking(p.x,p.y))return;p.cool=340;bombs.push({id:Math.random(),x:p.x,y:p.y,kind:weapon===0?'c':'t',range:weapon===0?1:2,at:performance.now(),boom:performance.now()+1500,ex:false,cells:[],until:0,sacred:false})}
function traceBlast(b,range=b.range){const cells=[];for(const[d1,d2]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const max=d1||d2?range:0;for(let n=0;n<=max;n++){let a=b.x+d1*n,c=b.y+d2*n;if(a<0||c<0||a>=C||c>=R||g[c][a]===1||g[c][a]===3)break;cells.push({x:a,y:c});if(g[c][a]===2)break}}return cells}
function damageCells(cells,allowBreak=true){for(const c of cells){if(allowBreak&&g[c.y][c.x]===2){g[c.y][c.x]=0;score+=50;for(const pk of picks)if(pk.hidden&&pk.x===c.x&&pk.y===c.y)pk.hidden=false}for(const e of enemies)if(e.alive&&e.x===c.x&&e.y===c.y){e.alive=false;score+=200}if(elite&&elite.alive&&elite.x===c.x&&elite.y===c.y){elite.alive=false;score+=500;say('¡ÉLITE FUERA!','#75e3ff',550)}for(const s of sappers)if(s.alive&&s.x===c.x&&s.y===c.y){s.alive=false;score+=120;leaveBlood(s.x,s.y)}if(boss.alive&&boss.x===c.x&&boss.y===c.y){if(!duel){say('¡PRIMERO LA TROPA!','#ff735f',600)}else{boss.hp--;score+=350;if(boss.hp<=0){boss.alive=false;score+=1000;say('¡'+BOSSES[L-1].name+' REVENTADO!','#ff8c42',700);setTimeout(win,720)}else say(`¡PEPINAZO! ${boss.hp} ♥`,'#ff8c42',580)}}if(p.x===c.x&&p.y===c.y)hurt()}hud();checkDuel()}
function sacredMerge(b){if(b.kind!=='t')return;const other=bombs.find(o=>o!==b&&o.kind==='t'&&o.ex&&performance.now()<o.until);if(!other)return;const set=new Set(other.cells.map(c=>key(c.x,c.y))),overlap=b.cells.find(c=>set.has(key(c.x,c.y)));if(!overlap)return;const base=new Set([...b.cells,...other.cells].map(c=>key(c.x,c.y))),extra=[];for(const[d1,d2]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=overlap.x+d1,y=overlap.y+d2;if(x>0&&y>0&&x<C-1&&y<R-1&&g[y][x]!==1&&g[y][x]!==3&&!base.has(key(x,y)))extra.push({x,y})}if(extra.length){b.sacred=true;b.sacredCells=extra;say('✝ EXPLOSIÓN SAGRADA ✝','#fff5a6',850);damageCells(extra,false)}}
function blast(b){b.cells=traceBlast(b);b.ex=true;b.until=performance.now()+440;damageCells(b.cells,true);sacredMerge(b)}
function hurt(){if(p.inv>0||over)return;lives--;hud();if(lives<=0){over=true;say('¡CAÍDO EN BATALLA!','#ff5c55',1100);setTimeout(()=>level(),1250);return}p.inv=1400;p.x=1;p.y=1;p.px=tcx(1);p.py=tcy(1);say('VIDA -1','#ff6d57',600)}
function checkDuel(){if(!duel&&normalsAlive()===0&&boss.alive){duel=true;zoomTarget=1.3;say('DUELO · '+BOSSES[L-1].name,'#ffd95c',1150)}else if(duel&&normalsAlive()>0){duel=false;zoomTarget=1}}
function win(){if(trans)return;trans=true;zoomTarget=1;score+=1000*L;hud();say('ESPAÑOLAZO','#ffe34d',1600);setTimeout(()=>{if(L===5){over=true;say('¡VICTORIA ESPAÑOLAZA!','#ffe34d',5000)}else{L++;level()}},1700)}
function touch(){for(const pk of picks)if(!pk.hidden&&!pk.taken&&p.x===pk.x&&p.y===pk.y){pk.taken=true;if(pk.type===1&&weapon<1){weapon=1;score+=500;say('TORREZNAZOS','#ffbc36',1250)}else if(pk.type===2){weapon=2;score+=800;say('TORREZNO DE SORIA','#ffe34d',1500)}hud()}for(const e of enemies)if(e.alive&&e.x===p.x&&e.y===p.y)hurt();if(elite&&elite.alive&&elite.x===p.x&&elite.y===p.y)hurt();for(const s of sappers)if(s.alive&&s.x===p.x&&s.y===p.y)detonateSapper(s);if(boss.alive&&boss.x===p.x&&boss.y===p.y)hurt()}
function dirsToward(e,target,iq){let ds=[[1,0],[-1,0],[0,1],[0,-1]];if(Math.random()<iq)ds.sort((a,b)=>(Math.abs(e.x+a[0]-target.x)+Math.abs(e.y+a[1]-target.y))-(Math.abs(e.x+b[0]-target.x)+Math.abs(e.y+b[1]-target.y)));else ds.sort(()=>Math.random()-.5);return ds}
function spawnSapper(now){const pos=freeTile(2,4,boss);if(!pos)return;let s=ent(pos.x,pos.y);s.fuse=now+3300;s.next=now+180;sappers.push(s);say('¡ZAPADOR!','#ff9c4a',430)}function leaveBlood(x,y){blood.add(key(x,y));for(const[d1,d2]of[[1,0],[-1,0],[0,1],[0,-1]])if(Math.random()<.35&&x+d1>0&&y+d2>0&&x+d1<C-1&&y+d2<R-1)blood.add(key(x+d1,y+d2))}function detonateSapper(s){if(!s.alive)return;s.alive=false;s.explode=traceBlast({x:s.x,y:s.y,range:1});s.explodeUntil=performance.now()+430;leaveBlood(s.x,s.y);for(const c of s.explode)if(p.x===c.x&&p.y===c.y)hurt()}
function teleportBoss(now){const pos=freeTile(0,99,p);if(pos){boss.x=pos.x;boss.y=pos.y;boss.px=tcx(pos.x);boss.py=tcy(pos.y);say('¡AHMED SE TELETRANSPORTA!','#cc8cff',650)}boss.nextTele=now+7000}
function spawnElite(now){if(elite&&elite.alive){boss.nextElite=now+15000;return}const pos=freeTile(4,99,p);if(pos){elite=ent(pos.x,pos.y);elite.next=now+350;elite.elite=true;duel=false;zoomTarget=1;say('¡GUARDIA ÉLITE!','#70d9ff',650)}boss.nextElite=now+15000}
function updateAmir(now){if(L!==2||!boss.alive||!duel)return 1;if(now<boss.restUntil)return 0;if(now<boss.sprintUntil)return .42;if(now>=boss.sprintAt){boss.sprintUntil=now+2000;boss.restUntil=now+3000;boss.sprintAt=now+3000+rnd(4000,6000);say('¡AMIR SPRINT!','#ffb657',450);return .42}if(boss.restUntil&&now<boss.restUntil+80)say('¡AMIR DESCANSA!','#8aff9a',700);return 1}
function update(dt,now){p.cool=Math.max(0,p.cool-dt);p.inv=Math.max(0,p.inv-dt);for(const pk of picks)if(!pk.hidden&&!pk.taken)pk.t+=dt*.004;for(const e of[p,boss,...enemies,...sappers,...(elite?[elite]:[])]){if(!e)continue;e.px+=(tcx(e.x)-e.px)*.23;e.py+=(tcy(e.y)-e.py)*.23}zoom+=(zoomTarget-zoom)*.08;if(!over&&!trans&&now-p.next>115){let moved=false;if(keys.ArrowLeft||keys.a||keys.A)moved=move(p,-1,0);else if(keys.ArrowRight||keys.d||keys.D)moved=move(p,1,0);else if(keys.ArrowUp||keys.w||keys.W)moved=move(p,0,-1);else if(keys.ArrowDown||keys.s||keys.S)moved=move(p,0,1);if(moved){p.next=now+(waterAt(p)?180:0);touch()}}for(const b of bombs)if(!b.ex&&now>=b.boom)blast(b);bombs=bombs.filter(b=>!b.ex||now<b.until);const k=CFG[L-1];for(const e of enemies){if(!e.alive)continue;if(now>=e.next&&!over&&!trans){for(const d of dirsToward(e,p,.48))if(move(e,d[0],d[1]))break;e.next=now+k.es+(waterAt(e)?320:0)}if(e.x===p.x&&e.y===p.y)hurt()}if(elite&&elite.alive&&now>=elite.next){for(const d of dirsToward(elite,p,.78))if(move(elite,d[0],d[1]))break;elite.next=now+520+(waterAt(elite)?260:0)}for(const s of sappers){if(!s.alive)continue;if(now>=s.fuse){detonateSapper(s);continue}if(now>=s.next){for(const d of dirsToward(s,p,.94))if(move(s,d[0],d[1]))break;s.next=now+600+(waterAt(s)?300:0)}}const bd=BOSSES[L-1],amirFactor=updateAmir(now);if(boss.alive&&amirFactor>0&&now>=boss.next&&!over&&!trans){for(const d of dirsToward(boss,p,bd.iq))if(move(boss,d[0],d[1]))break;boss.next=now+bd.speed*amirFactor+(waterAt(boss)?300:0)}if(duel&&boss.alive&&bd.sappers&&now>=boss.nextSpecial){spawnSapper(now);boss.nextSpecial=now+rnd(5000,10000)}if(duel&&boss.alive&&bd.tele&&now>=boss.nextTele)teleportBoss(now);if(L===5&&boss.alive&&now>=boss.nextElite)spawnElite(now);touch();checkDuel();sappers=sappers.filter(s=>s.alive||(s.explodeUntil&&now<s.explodeUntil))}
function wall(i,j){let a=i*TW,b=j*TH;ctx.fillStyle='#88714b';ctx.fillRect(a,b,TW,TH);ctx.fillStyle='#58452c';ctx.fillRect(a+7,b+7,TW-14,TH-14);ctx.fillStyle='#a18b61';for(let n=0;n<4;n++)ctx.fillRect(a+12+n*23,b+10,16,16)}function hard(i,j){let a=i*TW,b=j*TH;ctx.fillStyle='#34373b';ctx.fillRect(a+5,b+5,TW-10,TH-10);ctx.fillStyle='#686f75';ctx.fillRect(a+13,b+13,TW-26,TH-26);ctx.fillStyle='#9ca2a6';ctx.fillRect(a+20,b+20,18,10);ctx.fillRect(a+TW-39,b+TH-31,18,10)}function crate(i,j){let a=i*TW,b=j*TH;ctx.fillStyle='#8f572d';ctx.fillRect(a+7,b+7,TW-14,TH-14);ctx.fillStyle='#c88443';ctx.fillRect(a+14,b+14,TW-28,TH-28);ctx.strokeStyle='#6f3f1f';ctx.lineWidth=7;ctx.strokeRect(a+20,b+20,TW-40,TH-40)}function waterTile(i,j,now){let a=i*TW,b=j*TH;ctx.fillStyle='#356f8c';ctx.fillRect(a,b,TW,TH);ctx.fillStyle='#70bdd1';let off=(now/25)%30;for(let q=-1;q<4;q++)ctx.fillRect(a+q*30+off,b+24,15,5);ctx.fillStyle='#214e68';ctx.fillRect(a,b+TH-11,TW,11)}function bloodTile(i,j){let a=i*TW,b=j*TH;ctx.fillStyle='#6f151dcc';ctx.fillRect(a+20,b+25,TW-40,TH-42);ctx.fillStyle='#9e2932aa';ctx.fillRect(a+30,b+18,TW-62,14);ctx.fillRect(a+18,b+TH-32,24,10)}
function cross(cx,cy,s=1,blink=false){ctx.save();ctx.translate(cx,cy);if(blink)ctx.globalAlpha=.7+Math.sin(performance.now()/35)*.3;ctx.fillStyle='#6b4625';ctx.fillRect(-12*s,-37*s,24*s,74*s);ctx.fillRect(-33*s,-12*s,66*s,24*s);ctx.fillStyle='#e1bd79';ctx.fillRect(-7*s,-32*s,14*s,64*s);ctx.fillRect(-28*s,-7*s,56*s,14*s);ctx.restore()}function torz(cx,cy,s=1,bob=0,glow=false,blink=false){ctx.save();ctx.translate(cx,cy+bob);if(glow){ctx.fillStyle='#ffdd5930';ctx.beginPath();ctx.arc(0,0,42,0,7);ctx.fill()}if(blink)ctx.globalAlpha=.75+Math.sin(performance.now()/35)*.25;ctx.fillStyle='#5d2f17';ctx.fillRect(-34*s,-19*s,68*s,38*s);ctx.fillStyle='#e8b072';ctx.fillRect(-29*s,-14*s,58*s,28*s);ctx.fillStyle='#b45b2b';ctx.fillRect(-29*s,-14*s,58*s,7*s);ctx.fillStyle='#fff1c9';ctx.fillRect(-29*s,-2*s,58*s,7*s);ctx.fillStyle='#b45b2b';ctx.fillRect(-29*s,9*s,58*s,7*s);ctx.restore()}
function crown(){ctx.fillStyle='#f5ca42';ctx.fillRect(-24,-45,48,8);ctx.fillRect(-22,-54,10,11);ctx.fillRect(-5,-58,10,15);ctx.fillRect(12,-54,10,11);ctx.fillStyle='#fff0a5';ctx.fillRect(-2,-54,4,5)}function playerSprite(e,now){if(e.inv>0&&Math.floor(now/80)%2===0)return;const phase=now/100+e.step,bob=Math.sin(phase)*3,sw=Math.sin(phase)*8,knee=Math.sin(phase+1.5)*5;ctx.save();ctx.translate(e.px,e.py+bob);ctx.rotate(Math.sin(phase)*.025);ctx.fillStyle='#0005';ctx.fillRect(-31,34,62,10);ctx.fillStyle='#713a24';ctx.fillRect(-20+knee*.25,19,13,29);ctx.fillRect(7-knee*.25,19,13,29);ctx.fillStyle='#934f2d';ctx.fillRect(-23+sw*.15,45,19,8);ctx.fillRect(4-sw*.15,45,19,8);ctx.fillStyle='#d8ad38';ctx.fillRect(-31,-1,62,37);ctx.fillStyle='#b31e22';ctx.fillRect(-30,25,60,9);ctx.fillStyle='#f1c79d';ctx.fillRect(-26,-39,52,41);ctx.fillStyle='#6b3b24';ctx.fillRect(-28,-36,56,11);crown();ctx.fillStyle='#16110c';if(e.dir==='left')ctx.fillRect(-17,-20,6,6);else if(e.dir==='right')ctx.fillRect(11,-20,6,6);else{ctx.fillRect(-14,-20,6,6);ctx.fillRect(8,-20,6,6)}ctx.fillStyle='#d8ad38';ctx.save();ctx.translate(-32,5);ctx.rotate(sw*.008);ctx.fillRect(-9,-7,11,29);ctx.restore();ctx.save();ctx.translate(32,5);ctx.rotate(-sw*.008);ctx.fillRect(-2,-7,11,29);ctx.restore();ctx.fillStyle='#f5ead0';ctx.fillRect(-52,-8,19,5);ctx.fillRect(-43,-18,5,26);ctx.restore()}
function turbanHead(bossy=false){ctx.fillStyle='#c89c70';ctx.fillRect(-23,-32,46,35);ctx.fillStyle=bossy?'#f1e5b9':'#e8dbb7';ctx.fillRect(-27,-38,54,13);ctx.fillRect(-21,-45,42,10);ctx.fillStyle='#1a140f';ctx.fillRect(-13,-18,6,6);ctx.fillRect(7,-18,6,6);ctx.fillRect(-9,-6,18,4)}function enemySprite(e,now,bossy=false,eliteFlag=false){if(!e.alive)return;const phase=now/110+e.step,bob=Math.sin(phase)*3,sw=Math.sin(phase)*7;ctx.save();ctx.translate(e.px,e.py+bob);ctx.rotate(Math.sin(phase)*.018);ctx.fillStyle='#0005';ctx.fillRect(-29,33,58,9);let body=eliteFlag?'#235c82':bossy?'#6f2030':'#426d38',acc=eliteFlag?'#80d6ff':bossy?'#d2a23b':'#73512f';ctx.fillStyle=body;ctx.fillRect(-29,-1,58,38);ctx.fillStyle=acc;ctx.fillRect(-31,24,62,8);turbanHead(bossy);ctx.fillStyle=body;ctx.save();ctx.translate(-32,6);ctx.rotate(sw*.009);ctx.fillRect(-8,-7,10,29);ctx.restore();ctx.save();ctx.translate(32,6);ctx.rotate(-sw*.009);ctx.fillRect(-2,-7,10,29);ctx.restore();ctx.fillStyle='#5c331d';ctx.fillRect(-18,29+sw*.12,12,23);ctx.fillRect(6,29-sw*.12,12,23);if(bossy){ctx.fillStyle='#e0b841';ctx.fillRect(-31,-50,62,7);ctx.fillRect(-26,-57,12,9);ctx.fillRect(14,-57,12,9);ctx.fillStyle='#c98a2c';ctx.fillRect(36,-10,8,40);ctx.fillRect(31,-14,18,6)}else{ctx.fillStyle=eliteFlag?'#e4f7ff':'#6a2319';ctx.fillRect(36,-6,8,33)}ctx.restore()}
function sapperSprite(s,now){const phase=now/90+s.step;ctx.save();ctx.translate(s.px,s.py+Math.sin(phase)*3);ctx.rotate(Math.sin(phase)*.04);ctx.fillStyle='#ff8b3d';ctx.fillRect(-25,-5,50,34);ctx.fillStyle='#d7c39b';ctx.fillRect(-20,-29,40,27);ctx.fillStyle='#7d3722';ctx.fillRect(-24,-34,48,9);ctx.fillStyle='#3b2414';ctx.fillRect(-16,29+Math.sin(phase)*4,11,20);ctx.fillRect(5,29-Math.sin(phase)*4,11,20);ctx.restore()}
function drawWorld(now){for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(water.has(key(x,y)))waterTile(x,y,now);else{ctx.fillStyle=(x+y)%2?'#4c3b27':'#56412c';ctx.fillRect(x*TW,y*TH,TW,TH)}if(blood.has(key(x,y)))bloodTile(x,y);if(g[y][x]===1)wall(x,y);else if(g[y][x]===2)crate(x,y);else if(g[y][x]===3)hard(x,y)}for(const pk of picks)if(!pk.hidden&&!pk.taken){if(pk.type===1)torz(tcx(pk.x),tcy(pk.y),1,Math.sin(pk.t)*3,true);else{torz(tcx(pk.x)-17,tcy(pk.y),.76,Math.sin(pk.t)*3,true);torz(tcx(pk.x)+17,tcy(pk.y),.76,Math.sin(pk.t)*3,true)}}for(const b of bombs){if(!b.ex){const pulse=1+Math.sin((now-b.at)/120)*.06;if(b.kind==='c')cross(tcx(b.x),tcy(b.y),pulse,b.boom-now<450);else torz(tcx(b.x),tcy(b.y),pulse,0,false,b.boom-now<450)}else{for(const c of b.cells){const a=c.x*TW,d=c.y*TH;ctx.fillStyle=b.sacred?'#fff4a8':'#ffdd59';ctx.fillRect(a+5,d+5,TW-10,TH-10);ctx.fillStyle='#ff9f1a';ctx.fillRect(a+TW*.18,d+TH*.18,TW*.64,TH*.64)}if(b.sacredCells)for(const c of b.sacredCells){const a=c.x*TW,d=c.y*TH;ctx.fillStyle='#fff7c7';ctx.fillRect(a+12,d+12,TW-24,TH-24);ctx.strokeStyle='#f7df52';ctx.lineWidth=6;ctx.strokeRect(a+18,d+18,TW-36,TH-36)}}}for(const e of enemies)if(e.alive)enemySprite(e,now,false,false);if(elite&&elite.alive)enemySprite(elite,now,false,true);for(const s of sappers){if(s.alive)sapperSprite(s,now);else if(s.explode)for(const c of s.explode){const a=c.x*TW,d=c.y*TH;ctx.fillStyle='#ff5d39';ctx.fillRect(a+9,d+9,TW-18,TH-18)}}if(boss.alive)enemySprite(boss,now,true,false);playerSprite(p,now)}
function draw(now){ctx.clearRect(0,0,cv.width,cv.height);ctx.save();if(zoom>1.01){const target=elite&&elite.alive?elite:boss,fx=Math.max(cv.width/(2*zoom),Math.min(cv.width-cv.width/(2*zoom),(target.px+p.px)/2)),fy=Math.max(cv.height/(2*zoom),Math.min(cv.height-cv.height/(2*zoom),(target.py+p.py)/2));ctx.translate(cv.width/2,cv.height/2);ctx.scale(zoom,zoom);ctx.translate(-fx,-fy)}drawWorld(now);ctx.restore()}
function loop(now){const dt=now-last;last=now;update(dt,now);draw(now);requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fire()}if(e.key==='r'||e.key==='R'){L=1;score=0;blood.clear();level()}});addEventListener('keyup',e=>keys[e.key]=false);function bind(id,k){const e=$(id);['touchstart','mousedown'].forEach(v=>e.addEventListener(v,a=>{a.preventDefault();keys[k]=true}));['touchend','mouseup','mouseleave','touchcancel'].forEach(v=>e.addEventListener(v,a=>{a.preventDefault();keys[k]=false}))}bind('left','ArrowLeft');bind('right','ArrowRight');bind('up','ArrowUp');bind('down','ArrowDown');$('fire').onclick=e=>{e.preventDefault();fire()};$('play').onclick=()=>{$('start').style.display='none';L=1;score=0;blood.clear();level();requestAnimationFrame(loop)};
